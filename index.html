<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found and Favoured</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #5a3036;
            --accent: #d4a373;
            --bg: #fdfaf6;
            --text: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: white; display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.8s ease;
        }
        /* Yahan Splash image ka naam update kiya gaya hai */
        #splash-screen img { width: 80%; max-width: 450px; }
        .fade-out { opacity: 0; pointer-events: none; }

        /* --- HEADER --- */
        header {
            background: white; padding: 10px 20px; display: flex; 
            justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Main Logo update */
        .header-logo { height: 65px; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        .search-bar {
            background: #eee; padding: 8px 15px; border-radius: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .search-bar input { border: none; background: transparent; outline: none; width: 150px; }

        .icon-badge { position: relative; font-size: 22px; cursor: pointer; color: var(--primary); }
        .badge-count {
            position: absolute; top: -8px; right: -8px; background: red;
            color: white; font-size: 11px; padding: 2px 6px; border-radius: 50%;
        }

        /* --- NAVIGATION --- */
        .quick-nav {
            display: flex; overflow-x: auto; gap: 10px; padding: 15px;
            background: #fff; border-bottom: 1px solid #ddd; scrollbar-width: none;
        }
        .quick-nav::-webkit-scrollbar { display: none; }
        .quick-nav button {
            background: white; border: 1px solid var(--primary); color: var(--primary);
            padding: 8px 20px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: 600;
        }

        /* --- MAIN LAYOUT --- */
        .grid-main {
            display: grid; grid-template-columns: 220px 1fr 200px; gap: 20px; padding: 20px;
        }

        @media (max-width: 900px) {
            .grid-main { grid-template-columns: 1fr; }
            .category-column, .feature-column { display: none; }
        }

        /* --- PRODUCT CARDS --- */
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }
        .product-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card-img-box { position: relative; height: 280px; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .label-trending {
            position: absolute; top: 10px; left: 10px; background: var(--primary);
            color: white; font-size: 10px; padding: 3px 8px; border-radius: 5px;
        }

        .card-details { padding: 15px; text-align: center; }
        .card-details h3 { font-size: 16px; margin-bottom: 8px; color: var(--primary); }
        .price-tag { margin: 10px 0; }
        .current-price { font-weight: bold; color: var(--text); font-size: 18px; }
        .original-price { text-decoration: line-through; color: #999; margin-left: 10px; font-size: 14px; }
        
        .add-to-cart-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .add-to-cart-btn:active { transform: scale(0.95); }

        /* --- VIEW SECTIONS --- */
        .view-section { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .active-view { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .back-btn { margin-bottom: 20px; cursor: pointer; color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="IMG_20260501_105301.jpg" alt="Found and Favoured">
    </div>

    <header>
        <img src="1777613133002.png" class="header-logo" alt="Found and Favoured Logo" onclick="showView('home')">
        <div class="header-actions">
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" id="search-input" placeholder="Search products..." oninput="handleSearch()">
            </div>
            <div class="icon-badge" onclick="showView('cart')">
                <i class="fa fa-shopping-cart"></i>
                <span class="badge-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <div id="home-view" class="view-section active-view">
        <nav class="quick-nav">
            <button onclick="renderListing('all')">All Products</button>
            <button onclick="renderListing('Trending')">Trending</button>
            <button onclick="renderListing('Ethnic')">Ethnic Wear</button>
            <button onclick="renderListing('Mobiles')">Smartphones</button>
            <button onclick="renderListing('Spices')">Organic Spices</button>
        </nav>

        <div class="grid-main">
            <aside class="category-column">
                <h2 style="margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--accent); padding-bottom: 5px;">CATEGORIES</h2>
                <div style="cursor: pointer; padding: 8px 0;" onclick="renderListing('Ethnic')">Fashion - Ethnic</div>
                <div style="cursor: pointer; padding: 8px 0;" onclick="renderListing('Mobiles')">Electronics - Mobiles</div>
                <div style="cursor: pointer; padding: 8px 0;" onclick="renderListing('Spices')">Grocery - Spices</div>
                <div style="cursor: pointer; padding: 8px 0;" onclick="renderListing('Home Decor')">Lifestyle - Decor</div>
            </aside>

            <main>
                <div class="product-grid" id="featured-grid">
                    </div>
            </main>

            <aside class="feature-column">
                <div style="background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    <i class="fa fa-star" style="color: gold;"></i> Favoured Choice
                </div>
                <div style="background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    <i class="fa fa-tags" style="color: #5a3036;"></i> Best Sellers
                </div>
            </aside>
        </div>
    </div>

    <div id="listing-view" class="view-section">
        <div class="back-btn" onclick="showView('home')"><i class="fa fa-arrow-left"></i> Back to Home</div>
        <h2 id="listing-title" style="margin-bottom: 20px; color: var(--primary);">Products</h2>
        <div class="product-grid" id="listing-grid"></div>
    </div>

    <div id="cart-view" class="view-section">
        <div class="back-btn" onclick="showView('home')"><i class="fa fa-arrow-left"></i> Home</div>
        <h2 style="color: var(--primary);">Your Shopping Cart</h2>
        <div id="cart-items" style="margin-top: 20px; background: white; border-radius: 12px; padding: 10px;">
            </div>
    </div>

    <script>
        // --- DATA ---
        // Yahan 'img' mein main logo use kiya hai placeholder ke liye
        const products = [
            { id: 1, name: "Premium Ethnic Dress", price: 2999, old: 3999, img: "1777613133002.png", cat: "Ethnic", trending: true },
            { id: 2, name: "Silk Kurta Set", price: 1899, old: 2499, img: "1777613133002.png", cat: "Ethnic", trending: false },
            { id: 3, name: "Latest Smartphone", price: 15999, old: 19999, img: "1777613133002.png", cat: "Mobiles", trending: true },
            { id: 4, name: "Pure Organic Spices", price: 499, old: 599, img: "1777613133002.png", cat: "Spices", trending: true },
            { id: 5, name: "Decorative Cushion", price: 799, old: 1099, img: "1777613133002.png", cat: "Home Decor", trending: false }
        ];

        let cart = [];

        // --- SPLASH LOGIC ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('fade-out');
                renderHome();
            }, 2800);
        };

        // --- NAVIGATION ---
        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId + '-view').classList.add('active-view');
            window.scrollTo(0,0);
        }

        // --- RENDER FUNCTIONS ---
        function renderHome() {
            const grid = document.getElementById('featured-grid');
            grid.innerHTML = products.slice(0, 4).map(p => createCard(p)).join('');
        }

        function renderListing(filter) {
            showView('listing');
            const grid = document.getElementById('listing-grid');
            const title = document.getElementById('listing-title');
            
            let filtered = products;
            if (filter === 'Trending') filtered = products.filter(p => p.trending);
            else if (filter !== 'all') filtered = products.filter(p => p.cat === filter);

            title.innerText = filter === 'all' ? "All Products" : filter;
            grid.innerHTML = filtered.map(p => createCard(p)).join('');
        }

        function createCard(p) {
            return `
                <div class="product-card">
                    <div class="card-img-box">
                        <img src="${p.img}" alt="${p.name}">
                        ${p.trending ? '<span class="label-trending"><i class="fa fa-bolt"></i> Trending</span>' : ''}
                    </div>
                    <div class="card-details">
                        <h3>${p.name}</h3>
                        <div class="price-tag">
                            <span class="current-price">₹${p.price}</span>
                            <span class="original-price">₹${p.old}</span>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                    </div>
                </div>
            `;
        }

        // --- ACTIONS ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cart-count').innerText = cart.length;
            
            const cartList = document.getElementById('cart-items');
            cartList.innerHTML = cart.map(item => `
                <div style="display:flex; align-items:center; gap:15px; padding:15px; border-bottom:1px solid #eee;">
                    <img src="${item.img}" style="width:50px; border-radius:5px;">
                    <div>
                        <div style="font-weight:bold;">${item.name}</div>
                        <div style="color:var(--primary);">₹${item.price}</div>
                    </div>
                </div>
            `).join('');
            
            alert(product.name + " cart mein add ho gaya hai!");
        }

        function handleSearch() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('listing-grid');
            if(term.length > 0) {
                showView('listing');
                document.getElementById('listing-title').innerText = "Results for: " + term;
                const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.cat.toLowerCase().includes(term));
                grid.innerHTML = filtered.length > 0 ? filtered.map(p => createCard(p)).join('') : '<p style="padding:20px;">No products found.</p>';
            }
        }
    </script>
</body>
              </html>
