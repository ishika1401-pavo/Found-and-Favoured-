<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Panel - Add Products</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>CEO Admin Panel</h2>
    
    <input type="text" id="p_name" placeholder="Product Name (e.g. Blue Dress)">
    
    <input type="number" id="p_price" placeholder="Price (e.g. 599)">
    
    <input type="text" id="p_url" placeholder="Image URL (Amazon/Drive Link)">
    
    <label for="p_category">Select Category:</label>
    <select id="p_category">
        <option value="outfits">Outfits</option>
        <option value="shoes">Shoes</option>
        <option value="trending">Trending</option>
        <option value="accessories">Accessories</option>
    </select>

    <button onclick="uploadProduct()">Publish Product</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // Yahan apni Firebase Config daalein (Jo aapke purane code mein thi)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function uploadProduct() {
        // Form se data nikalna
        const name = document.getElementById('p_name').value;
        const price = document.getElementById('p_price').value;
        const url = document.getElementById('p_url').value;
        const category = document.getElementById('p_category').value;

        // Validation check
        if(!name || !price || !url) {
            alert("Please fill all fields!");
            return;
        }

        // Firebase Firestore mein save karna
        db.collection("products").add({
            name: name,
            price: price,
            url: url,
            category: category, // Yeh automatically field bana dega
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            alert("Product successfully added to: " + category);
            // Form clear karna
            document.getElementById('p_name').value = "";
            document.getElementById('p_price').value = "";
            document.getElementById('p_url').value = "";
        })
        .catch((error) => {
            console.error("Error: ", error);
            alert("Something went wrong!");
        });
    }
</script>

</body>
</html>
