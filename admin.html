<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Panel - Simple</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 350px; margin: auto; }
        input, button { width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>Add Product</h2>
    <input type="text" id="n" placeholder="Product Name">
    <input type="text" id="p" placeholder="Price">
    <input type="text" id="u" placeholder="Image URL">
    <button onclick="save()">Publish</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // Yahan apni wahi purani config daalein jo pehle kaam kar rahi thi
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function save() {
        const name = document.getElementById('n').value;
        const price = document.getElementById('p').value;
        const url = document.getElementById('u').value;

        db.collection("products").add({
            name: name,
            price: price,
            url: url,
            date: new Date().toLocaleString()
        })
        .then(() => {
            alert("Published Successfully!");
            document.getElementById('n').value = "";
            document.getElementById('p').value = "";
            document.getElementById('u').value = "";
        })
        .catch((error) => {
            alert("Error: " + error);
        });
    }
</script>

</body>
</html>
