<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Panel - Corrected</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #eee; }
        .panel { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        h2 { text-align: center; margin-top: 0; }
    </style>
</head>
<body>

<div class="panel">
    <h2>CEO Panel</h2>
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="price" placeholder="Price">
    <input type="text" id="url" placeholder="Image URL">
    
    <label>Category Chunein:</label>
    <select id="category">
        <option value="outfits">Outfits</option>
        <option value="shoes">Shoes</option>
        <option value="accessories">Accessories</option>
    </select>

    <button onclick="publishData()">Publish to Firebase</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // 1. YAHAN APNI FIREBASE CONFIG DAALEIN (Jo aapke purane code mein thi)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // 2. Firebase Initialize
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 3. Publish Function
    function publishData() {
        const pName = document.getElementById('name').value;
        const pPrice = document.getElementById('price').value;
        const pUrl = document.getElementById('url').value;
        const pCategory = document.getElementById('category').value;

        if(!pName || !pPrice || !pUrl) {
            alert("Saari fields bharna zaroori hai!");
            return;
        }

        db.collection("products").add({
            name: pName,
            price: pPrice,
            url: pUrl,
            category: pCategory, // Ye automatic field bana dega
            date: new Date().toISOString()
        })
        .then(() => {
            alert("Data successfully publish ho gaya!");
            // Input clear karein
            document.getElementById('name').value = "";
            document.getElementById('price').value = "";
            document.getElementById('url').value = "";
        })
        .catch((error) => {
            console.error("Error: ", error);
            alert("Publish nahi ho raha. Console check karein.");
        });
    }
</script>

</body>
</html>
